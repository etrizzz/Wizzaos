name: Validate WizzaOS

on:
  push:
    branches: [main, 'wizza-*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          set -e
          find scripts apps -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
      - name: Reject merge markers
        run: |
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
      - name: Check required files
        run: |
          set -e
          for f in README.md docs/ARCHITECTURE.md packages/base.txt packages/desktop.txt packages/compatibility.txt packages/french.txt packages/installer.txt scripts/build-iso.sh scripts/preflight.sh scripts/chroot-finalize.sh apps/wizza-center/wizza-center.sh apps/wizza-session/wizza-session.sh apps/wizza-compat/wizza-winlaunch.sh apps/wizza-installer/wizza-installer.sh installer/calamares/settings.conf installer/calamares/modules/unpackfs.conf installer/calamares/modules/displaymanager.conf installer/calamares/modules/partition.conf installer/calamares/modules/bootloader.conf installer/calamares/branding/wizzaos/branding.desc overlay/usr/share/applications/wizza-installer.desktop; do test -f "$f"; done
      - name: Validate package manifests
        run: |
          set -e
          for manifest in packages/*.txt; do
            if grep -n -E '^[[:space:]]+|[[:space:]]+$' "$manifest"; then exit 1; fi
          done
      - name: Verify compatibility core
        run: |
          grep -q '^wine$' packages/compatibility.txt
          grep -q '^dosbox-x$' packages/compatibility.txt
          grep -q '^libcdio-utils$' packages/compatibility.txt
          grep -q '^linux-firmware$' packages/base.txt
      - name: Verify installer wiring
        run: |
          grep -q 'wizza-installer.list.chroot' scripts/build-iso.sh
          grep -q '/run/live/medium/live/filesystem.squashfs' installer/calamares/modules/unpackfs.conf
          grep -q '^efiBootloaderId: "WizzaOS"$' installer/calamares/modules/bootloader.conf
          grep -q '^Exec=/usr/local/bin/wizza-installer$' overlay/usr/share/applications/wizza-installer.desktop
      - name: Verify French defaults
        run: |
          grep -q '^LANG=fr_FR.UTF-8$' overlay/etc/default/locale
          grep -q '^language-pack-fr$' packages/french.txt
      - name: Verify WizzaOS identity
        run: |
          grep -q '^ID=wizzaos$' overlay/etc/os-release
          grep -q '^NAME="WizzaOS"$' overlay/etc/os-release
